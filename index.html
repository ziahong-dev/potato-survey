<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<title>대학원 생활 경험 설문</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --white:#FFFFFF; --g50:#F9FAFB; --g100:#F2F4F6; --g200:#E5E8EB; --g300:#D1D6DB; --g400:#B0B8C1;
  --g500:#8B95A1; --g600:#6B7684; --g700:#4E5968; --g800:#333D4B; --g900:#191F28;
  --blue:#3182F6; --blue-d:#1B64DA; --blue-l:#E8F3FF; --red:#F04452; --yellow-l:#FFF8E1;
  --radius:16px; --col:480px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--g900);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-0.01em}
button{font:inherit;color:inherit}
.shell{max-width:var(--col);margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}

/* 상단 바 */
.topbar{position:sticky;top:0;z-index:20;background:var(--white);padding:env(safe-area-inset-top) 0 0}
.topbar-in{height:52px;display:flex;align-items:center;padding:0 8px}
.back{width:44px;height:44px;border:none;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.back:hover{background:var(--g100)}
.back svg{width:24px;height:24px}
.back.is-hidden{visibility:hidden}
.progress{height:3px;margin:0 20px;background:var(--g100);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--blue);border-radius:3px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.testmode{margin:8px 20px 0;padding:8px 12px;border-radius:10px;background:var(--yellow-l);color:#8A6100;font-size:13px;font-weight:500}

/* 본문 */
main{padding:24px 20px 180px}
.screen{animation:in .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.screen.back-anim{animation-name:inBack}
@keyframes inBack{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.sprite{display:block;width:52px;height:52px;margin:4px 0 16px;animation:bob 2.4s ease-in-out infinite}
.sprite svg{width:100%;height:100%;display:block}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.chip-ctx{display:inline-block;font-size:13px;font-weight:600;color:var(--blue-d);background:var(--blue-l);border-radius:8px;padding:5px 10px;margin:0 0 12px}
.chip-ctx.grey{color:var(--g600);background:var(--g100)}
h1{font-size:24px;line-height:1.42;font-weight:700;letter-spacing:-0.025em;margin:0 0 8px;outline:none;white-space:pre-line}
.note{font-size:15px;line-height:1.6;color:var(--g600);margin:0 0 4px;white-space:pre-line}
.list{margin-top:24px;display:flex;flex-direction:column;gap:8px}

/* 세로 선택지 */
.opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--g100);border:none;border-radius:var(--radius);padding:16px 18px;min-height:58px;
  font-size:16px;font-weight:500;color:var(--g800);line-height:1.45;transition:background .15s,color .15s,transform .1s}
.opt:active{transform:scale(.985)}
.opt input,.tile input,.seg input,.xchip input{position:absolute;opacity:0;pointer-events:none}
.opt .txt{flex:1}
.opt .sub{display:block;font-size:13px;font-weight:400;color:var(--g500);margin-top:2px}
.opt .mark{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--g300);transition:background .15s}
.opt.multi .mark{border-radius:7px}
.opt .mark svg,.tile .ck svg{width:14px;height:14px;opacity:0;transition:opacity .15s}
.opt.on{background:var(--blue-l);color:var(--blue-d);font-weight:600}
.opt.on .sub{color:#4A8BEA}
.opt.on .mark{background:var(--blue)}
.opt.on .mark svg,.tile.on .ck svg{opacity:1}
.opt.off,.tile.off{opacity:.4;cursor:not-allowed}
.opt:focus-within,.tile:focus-within{outline:2px solid var(--blue);outline-offset:2px}
.other{width:100%;margin:2px 0 4px;padding:15px 16px;border:2px solid var(--blue);border-radius:14px;
  font:inherit;font-size:16px;background:var(--white);color:var(--g900);outline:none}
.other::placeholder,textarea::placeholder{color:var(--g400)}
.counter{font-size:13px;color:var(--g500);text-align:right;margin-top:6px}

/* 바둑판 선택지 (9개 초과 · 짧은 글) */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:18px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:10px 4px 9px;min-height:80px;border-radius:14px;background:var(--g100);cursor:pointer;text-align:center;
  font-size:13px;font-weight:500;color:var(--g800);line-height:1.3;gap:6px;transition:background .15s,box-shadow .15s,transform .1s}
.tile:active{transform:scale(.97)}
.tile .ico{width:30px;height:30px;flex:none}
.tile .ico svg{width:100%;height:100%;display:block}
.tile .ck{position:absolute;top:7px;right:7px;width:18px;height:18px;border-radius:6px;background:var(--g300);display:grid;place-items:center;transition:background .15s}
.tile .ck svg{width:11px;height:11px}
.tile.on{background:var(--blue-l);color:var(--blue-d);font-weight:600;box-shadow:inset 0 0 0 2px var(--blue)}
.tile.on .ck{background:var(--blue)}
.tiles + .other{margin-top:10px}

/* 가로 척도 (적음 ← → 많음) */
.scale{margin-top:28px}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg{position:relative;cursor:pointer;display:block}
.seg .box{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;height:96px;padding:12px 2px 12px;
  border-radius:14px;background:var(--g100);transition:background .15s,transform .1s}
.seg:active .box{transform:scale(.96)}
.seg .bar{width:12px;border-radius:3px;background:var(--blue);transition:background .15s}
.seg .t{font-size:13px;font-weight:600;color:var(--g700);text-align:center;line-height:1.25;min-height:16px}
.seg input:checked + .box{background:var(--blue)}
.seg input:checked + .box .bar{background:#fff;opacity:1!important}
.seg input:checked + .box .t{color:#fff}
.seg input:focus-visible + .box{outline:2px solid var(--blue);outline-offset:2px}
.ends{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:10px;font-size:13px;color:var(--g500);line-height:1.4}
.ends span{max-width:48%}
.ends span:first-child::before{content:"← ";color:var(--g400)}
.ends span:last-child{text-align:right}
.ends span:last-child::after{content:" →";color:var(--g400)}
.extras{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.xchip{position:relative;cursor:pointer}
.xchip span{display:inline-block;padding:11px 16px;border-radius:12px;background:var(--white);box-shadow:inset 0 0 0 1px var(--g200);font-size:15px;font-weight:500;color:var(--g600);transition:background .15s}
.xchip input:checked + span{background:var(--g800);color:#fff;box-shadow:none}
.xchip input:focus-visible + span{outline:2px solid var(--blue);outline-offset:2px}

/* 여러 항목 척도 */
.row-card{border:1px solid var(--g200);border-radius:var(--radius);padding:16px 14px 14px}
.row-card + .row-card{margin-top:4px}
.row-title{font-size:16px;font-weight:600;color:var(--g800);margin:0 0 12px;line-height:1.45}
.row-card.done .row-title::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-left:8px;vertical-align:middle}
.row-card .scale{margin-top:0}
.row-card .seg .box{height:66px;gap:7px;padding:9px 2px 9px;border-radius:12px}
.row-card .seg .t{font-size:12px}
.row-card .ends{font-size:12px;margin-top:8px}
.row-card .extras{margin-top:10px}
.row-card .xchip span{padding:7px 12px;font-size:13px;border-radius:10px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{position:relative;cursor:pointer}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill span{display:inline-block;padding:9px 13px;border-radius:12px;background:var(--g100);font-size:14px;font-weight:500;color:var(--g700);transition:background .15s,color .15s}
.pill input:checked + span{background:var(--blue);color:#fff;font-weight:600}
.pill input:focus-visible + span{outline:2px solid var(--blue);outline-offset:2px}

textarea{width:100%;min-height:180px;margin-top:24px;padding:16px;border:none;border-radius:var(--radius);background:var(--g100);
  font:inherit;font-size:16px;line-height:1.6;color:var(--g900);resize:vertical;outline:none}
textarea:focus{box-shadow:inset 0 0 0 2px var(--blue);background:var(--white)}

/* 인트로 */
.hero{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px;margin:8px 0 28px;padding:20px 12px;background:var(--g50);border-radius:20px}
.hero .s{width:100%;max-width:52px;aspect-ratio:1;margin:0 auto;animation:bob 2.4s ease-in-out infinite}
.hero .s svg{width:100%;height:100%;display:block}
.def{background:var(--blue-l);border-radius:var(--radius);padding:16px 18px;margin:20px 0 8px;font-size:15px;line-height:1.65;color:var(--g800)}
.def strong{color:var(--blue-d)}
.facts{list-style:none;padding:0;margin:20px 0 0;display:flex;flex-direction:column;gap:14px}
.facts li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.6;color:var(--g700)}
.facts .ic{flex:none;width:24px;height:24px;border-radius:8px;background:var(--g100);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--g600);margin-top:1px}
.contact{font-size:13px;line-height:1.6;color:var(--g500);margin-top:24px}
.contact a{color:var(--g600)}

/* 종료 화면 */
.end{text-align:center;padding-top:48px}
.end .note{margin-bottom:0}
.party{display:flex;justify-content:center;gap:4px;margin:0 auto 28px;flex-wrap:wrap;max-width:340px}
.party .s{width:44px;height:44px;animation:hop .9s cubic-bezier(.3,.7,.4,1) infinite}
.party .s svg{width:100%;height:100%;display:block}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
.solo{width:72px;height:72px;margin:0 auto 24px}
.quote{margin:20px auto 20px;padding:20px 18px;background:var(--blue-l);border-radius:var(--radius);max-width:360px}
.quote blockquote{margin:0;font-size:19px;font-weight:700;color:var(--blue-d);letter-spacing:-0.02em;line-height:1.45}
.quote figcaption{margin-top:6px;font-size:13px;color:#4A8BEA}
.support{margin-top:32px;text-align:left;background:var(--g50);border-radius:var(--radius);padding:16px 18px;font-size:14px;line-height:1.65;color:var(--g600)}
.support strong{color:var(--g800)}

/* 하단 CTA */
.cta-wrap{position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none}
.cta-in{max-width:var(--col);margin:0 auto;padding:24px 20px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 28%);pointer-events:auto}
.cta{width:100%;height:56px;border:none;border-radius:var(--radius);background:var(--blue);color:#fff;font-size:17px;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s,transform .1s}
.cta:hover{background:var(--blue-d)}
.cta:active{transform:scale(.985)}
.cta:disabled{opacity:.3;cursor:default;transform:none;background:var(--blue)}
.cta.grey{background:var(--g100);color:var(--g700)}
.cta.grey:hover{background:var(--g200)}
.subbtn{display:block;width:100%;margin-top:6px;height:44px;border:none;background:none;color:var(--g500);font-size:15px;font-weight:500;cursor:pointer;border-radius:12px}
.subbtn:hover{background:var(--g100)}
.err{margin:0 0 10px;font-size:14px;color:var(--red);text-align:center;font-weight:500}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,8px);background:rgba(25,31,40,.92);color:#fff;font-size:14px;font-weight:500;
  padding:12px 16px;border-radius:14px;opacity:0;transition:opacity .2s,transform .2s;z-index:40;pointer-events:none;max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (min-width:600px){ main{padding-top:40px} h1{font-size:26px} }
@media (max-height:740px){ .tile{min-height:72px;padding:8px 3px 7px;font-size:12.5px} .tile .ico{width:26px;height:26px} .tiles{margin-top:14px} }
@media (max-width:360px){ .tiles{grid-template-columns:repeat(2,1fr)} .seg .t{font-size:12px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="topbar-in">
      <button type="button" class="back is-hidden" id="back" aria-label="이전 질문으로">
        <svg viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
    </div>
    <div class="progress" role="progressbar" aria-label="설문 진행률" aria-valuemin="0" aria-valuemax="100"><i id="bar"></i></div>
    <div class="testmode" id="testmode" hidden>테스트 모드예요. 응답이 저장되지 않아요.</div>
  </header>
  <main id="app" aria-live="polite"></main>
</div>
<div class="cta-wrap" id="ctaWrap">
  <div class="cta-in">
    <p class="err" id="err" role="alert" hidden></p>
    <button type="button" class="cta" id="cta">다음</button>
    <button type="button" class="subbtn" id="sub" hidden></button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>

   설정 — 배포 전에 이 부분만 바꾸면 돼요
   ========================================================= */

  // 첫 화면 문의처
  CONTACT_NAMES: '홍슬기 · 방세희 · 김하은 · 최연주',

  // 첫 화면 수업 이름
  COURSE: '디자인 트렌드 연구',
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label = o => Array.isArray(o) ? o[0] : (typeof o === 'string' ? o : o.label);
const sprite = name => SPRITES[name] || '';

function iconSvg(name){
  const ic = ICONS.icons && ICONS.icons[name]; if (!ic) return '';
  let r = '';
  ic.forEach((row, y) => { let x = 0; while (x < 16) { const ch = row[x]; if (ch === '.') { x++; continue; }
    let e = x; while (e + 1 < 16 && row[e + 1] === ch) e++;
    r += `<rect x="${x}" y="${y}" width="${e - x + 1}" height="1" fill="${ICONS.palette[ch]}"/>`; x = e + 1; } });
  return `<svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}

function orderOf(q){
  if (!q.shuffle) return q.options;
  if (!orders[q.id]) {
    const pinned = q.options.filter(o => label(o) === OTHER || (q.exclusive || []).includes(label(o)));
    const rest = q.options.filter(o => !pinned.includes(o));
    for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
    orders[q.id] = [...rest, ...pinned];
  }
  return orders[q.id];
}

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

function optHtml(q){
  const multi = q.type === 'checkbox';
  const sel = answers[q.id];
  return orderOf(q).map(o => {
    const v = label(o);
    const on = multi ? (sel || []).includes(v) : sel === v;
    const ex = q.exclusive && q.exclusive.includes(v);
    let h = `<label class="opt${multi ? ' multi' : ''}${on ? ' on' : ''}">
      <input type="${multi ? 'checkbox' : 'radio'}" name="${q.id}" value="${esc(v)}"${on ? ' checked' : ''}${ex ? ' data-ex="1"' : ''}>
      <span class="txt">${esc(v)}${(typeof o === 'object' && !Array.isArray(o) && o.sub) ? `<span class="sub">${esc(o.sub)}</span>` : ''}</span>
      <span class="mark" aria-hidden="true">${CHECK}</span></label>`;
    if (v === OTHER) h += otherInput(q, on);
    return h;
  }).join('');
}

function tilesHtml(q){
  const sel = answers[q.id] || [];
  const tiles = q.options.map(([v, ic]) => {
    const on = sel.includes(v);
    return `<label class="tile${on ? ' on' : ''}">
      <input type="checkbox" name="${q.id}" value="${esc(v)}"${on ? ' checked' : ''}>
      <span class="ck" aria-hidden="true">${CHECK}</span>
      <span class="ico">${iconSvg(ic)}</span><span>${esc(v)}</span></label>`;
  }).join('');
  return `<div class="tiles">${tiles}</div>${otherInput(q, sel.includes(OTHER))}`;
}

function scaleHtml(name, scale, current, extras, dataAttrs = ''){
  const segs = scale.map(([v, s], i) => `
    <label class="seg"><input type="radio" name="${name}" value="${esc(v)}"${current === v ? ' checked' : ''} ${dataAttrs} aria-label="${esc(v)}">
      <span class="box"><span class="bar" style="height:${8 + i * 7}px;opacity:${(.28 + i * .18).toFixed(2)}"></span><span class="t">${esc(s)}</span></span></label>`).join('');
  const ex = (extras || []).map(v => `<label class="xchip"><input type="radio" name="${name}" value="${esc(v)}"${current === v ? ' checked' : ''} ${dataAttrs}><span>${esc(v)}</span></label>`).join('');
  return `<div class="scale" role="radiogroup">
    <div class="track">${segs}</div>
    <div class="ends"><span>${esc(scale[0][0])}</span><span>${esc(scale[scale.length - 1][0])}</span></div>
    ${ex ? `<div class="extras">${ex}</div>` : ''}
  </div>`;
}

function gridHtml(q){
  const val = answers[q.id] || {};
  return q.rows.map(([key, text]) => `
    <div class="row-card${val[key] ? ' done' : ''}" aria-label="${esc(text)}">
      <p class="row-title">${esc(text)}</p>
      ${q.pills
        ? `<div class="pills" role="radiogroup">${q.scale.map(([v]) => `<label class="pill"><input type="radio" name="${q.id}__${key}" value="${esc(v)}" data-grid="${q.id}" data-row="${key}"${val[key] === v ? ' checked' : ''}><span>${esc(v)}</span></label>`).join('')}</div>`
        : scaleHtml(`${q.id}__${key}`, q.scale, val[key], q.extras, `data-grid="${q.id}" data-row="${key}"`)}
    </div>`).join('');
}

function renderQ(q, dir){
  const pos = IDX[q.id];
  setProgress(((pos + 1) / (QS.length + 1)) * 100);
  $back.classList.remove('is-hidden');
  let body = '';
  if (q.type === 'radio' || q.type === 'checkbox') body = `<div class="list">${optHtml(q)}</div>`;
  else if (q.type === 'tiles') body = tilesHtml(q);
  else if (q.type === 'scale') body = scaleHtml(q.id, q.scale, answers[q.id], q.extras);
  else if (q.type === 'grid') body = `<div class="list">${gridHtml(q)}</div>`;
  else if (q.type === 'text') body = `<textarea id="ta" data-text="${q.id}" maxlength="1000" placeholder="자유롭게 적어 주세요" aria-label="${esc(q.title)}">${esc(answers[q.id] || '')}</textarea><p class="counter"><span id="cnt">${(answers[q.id] || '').length}</span>/1000</p>`;
  const ctx = q.ctx ? `<span class="chip-ctx">${esc(q.ctx)}</span>` : (q.optional ? '<span class="chip-ctx grey">선택 질문이에요</span>' : '');
  $app.innerHTML = `<section class="screen${dir === 'back' ? ' back-anim' : ''}">
    ${q.type === 'tiles' ? '' : `<div class="sprite" aria-hidden="true">${spriteFor(q)}</div>`}
    ${ctx ? `<div>${ctx}</div>` : ''}
    <h1 tabindex="-1"><span class="vh">${q.n}번 질문. </span>${esc(q.title)}</h1>
    ${q.note ? `<p class="note">${esc(q.note)}</p>` : ''}
    ${body}
  </section>`;
  $sub.hidden = true;
  if (q.type === 'checkbox' || q.type === 'tiles') enforce(q);
  refreshCta();
}

function renderEnd(kind){
  done = kind === 'done';
  $back.classList.add('is-hidden');
  $sub.hidden = true;
  const E = {
    done:     { art:'party', title:'응답을 보냈어요', note:'소중한 경험을 나눠 주셔서 고마워요.', support:true },
    decline:  { art:'chippum', title:'참여하지 않기로 했어요', quote:['슬픔은 나누면 반이 된다.','스웨덴 속담'], note:'관심 가져 주셔서 고마워요.\n마음이 바뀌면 언제든 다시 시작할 수 있어요.', cta:'그래도 참여할게요' },
    screenout:{ art:'gemmulae', title:'대학원생만 참여할 수 있는\n설문이에요', note:'석사·박사·석박사통합과정(재학·휴학·수료)에 있는 분을 대상으로 해요. 관심 가져 주셔서 고마워요.', cta:'처음으로' },
    already:  { art:'tottum', title:'이미 응답했어요', note:'이 기기에서 이미 설문을 보냈어요.\n참여해 주셔서 고마워요.', cta:'새로 응답하기', ctaGrey:true },
  }[kind];
  setProgress(kind === 'done' ? 100 : 0);
  const art = E.art === 'party'
    ? `<div class="party" aria-hidden="true">${CHAR_ORDER.map((c, i) => `<div class="s" style="animation-delay:${i * .08}s">${sprite(c)}</div>`).join('')}</div>`
    : `<div class="solo sprite" aria-hidden="true">${sprite(E.art)}</div>`;
  $app.innerHTML = `<section class="screen end">${art}
    <h1 tabindex="-1">${esc(E.title)}</h1>
    ${E.quote ? `<figure class="quote"><blockquote>“${esc(E.quote[0])}”</blockquote><figcaption>${esc(E.quote[1])}</figcaption></figure>` : ''}
    <p class="note">${esc(E.note)}</p>
    ${TEST_MODE && kind === 'done' ? '<p class="note" style="color:#8A6100;margin-top:12px">테스트 모드라 실제로 저장되지는 않았어요.</p>' : ''}
    ${E.support ? `<div class="support">설문하면서 마음이 무거워졌다면, 학교 <strong>학생상담센터</strong>나 <strong>자살예방상담전화 109</strong>(24시간)에서 이야기를 나눌 수 있어요.</div>` : ''}
  </section>`;
  if (E.cta) { $ctaWrap.hidden = false; setCta(E.cta, false); $cta.classList.toggle('grey', !!E.ctaGrey); }
  else $ctaWrap.hidden = true;
}

function render(dir){
  clearTimeout(autoTimer);
  $('toast').classList.remove('show');
  $err.hidden = true;
  $ctaWrap.hidden = false;
  $cta.classList.remove('grey');
  const cur = stack[stack.length - 1];
  if (cur === 'intro') renderIntro();
  else if (QS[IDX[cur]]) renderQ(QS[IDX[cur]], dir);
  else renderEnd(cur);
  window.scrollTo(0, 0);
  const h = $app.querySelector('h1'); if (h) h.focus({preventScroll:true});
}

/* ---------- 버튼 상태 ---------- */
function setCta(text, disabled){ $cta.textContent = text; $cta.disabled = !!disabled; }
function answered(q){
  const v = answers[q.id];
  if (q.type === 'checkbox' || q.type === 'tiles') return !!(v && v.length);
  if (q.type === 'grid') return !!(v && Object.keys(v).length);
  if (q.type === 'text') return !!(v && v.trim());
  return !!v;
}
function isLast(q){ return nextOf(q) === null; }
function refreshCta(){
  const cur = stack[stack.length - 1];
  const q = QS[IDX[cur]]; if (!q) return;
  const has = answered(q);
  if (q.required && !has) return setCta('다음', true);
  if (isLast(q)) return setCta('제출하기', false);
  setCta(has ? '다음' : '건너뛰기', false);
}

/* ---------- 이동 ---------- */
function nextOf(q){
  for (let i = IDX[q.id] + 1; i < QS.length; i++) if (!QS[i].when || QS[i].when(answers)) return QS[i].id;
  return null;
}
function go(to){
  stack.push(to);
  try { history.pushState({d: stack.length}, ''); } catch(_){}
  render('fwd');
}
function goBack(){
  if (done) return;
  if (stack.length > 1) { stack.pop(); render('back'); }
}
window.addEventListener('popstate', () => {
  if (done) { try { history.pushState({d: stack.length}, ''); } catch(_){} return; }
  goBack();
});
$back.addEventListener('click', () => { try { history.back(); } catch(_) { goBack(); } });
$sub.addEventListener('click', () => { if (stack[stack.length - 1] === 'intro') go('decline'); });

$cta.addEventListener('click', () => {
  if (busy) return;
  const cur = stack[stack.length - 1];
  if (cur === 'intro') { startedAt = startedAt || new Date(); return go(QS[0].id); }
  if (cur === 'decline') { stack = ['intro']; startedAt = new Date(); return go(QS[0].id); }
  if (cur === 'screenout') return restart();
  if (cur === 'already') { try { localStorage.removeItem(STORE_KEY); } catch(_){} return restart(); }
  const q = QS[IDX[cur]];
  if (!q) return;
  if (q.required && !answered(q)) { toast('답을 골라 주세요'); return; }
  const out = q.exit && q.exit(answers);
  if (out) return go(out);
  const nx = nextOf(q);
  if (nx === null) return submit();
  go(nx);
});

function restart(){ answers = {}; orders = {}; startedAt = null; done = false; stack = ['intro']; render('back'); }

/* ---------- 입력 처리 ---------- */
function enforce(q){
  if (!q.max) return;
  const boxes = [...$app.querySelectorAll(`input[name="${q.id}"]`)];
  const n = boxes.filter(b => b.checked && !b.dataset.ex).length;
  boxes.forEach(b => {
    const off = !b.checked && !b.dataset.ex && n >= q.max;
    b.closest('.opt, .tile').classList.toggle('off', off);
  });
}

$app.addEventListener('click', ev => {
  const blocked = ev.target.closest('.opt.off, .tile.off');
  if (blocked) { ev.preventDefault(); const q = QS[IDX[blocked.querySelector('input').name]]; toast(`${q.max}개까지 고를 수 있어요`); }
});

$app.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.grid) {
    const g = answers[t.dataset.grid] || (answers[t.dataset.grid] = {});
    g[t.dataset.row] = t.value;
    t.closest('.row-card').classList.add('done');
    refreshCta();
    return;
  }
  const q = QS[IDX[t.name]]; if (!q) return;
  const boxes = [...$app.querySelectorAll(`input[name="${q.id}"]`)];
  if (q.type === 'radio' || q.type === 'scale') {
    answers[q.id] = t.value;
  } else {
    if (t.checked && t.dataset.ex) boxes.forEach(b => { if (b !== t) b.checked = false; });
    if (t.checked && !t.dataset.ex) boxes.forEach(b => { if (b.dataset.ex) b.checked = false; });
    answers[q.id] = boxes.filter(b => b.checked).map(b => b.value);
    enforce(q);
  }
  boxes.forEach(b => { const w = b.closest('.opt, .tile'); if (w) w.classList.toggle('on', b.checked); });
  const other = $app.querySelector(`input[data-other="${q.id}"]`);
  const otherOn = Array.isArray(answers[q.id]) ? answers[q.id].includes(OTHER) : answers[q.id] === OTHER;
  if (other) { other.hidden = !otherOn; if (otherOn && t.value === OTHER) other.focus(); }
  refreshCta();
  // 하나만 고르는 질문은 고르면 바로 다음으로 (기타·마지막 질문 제외)
  clearTimeout(autoTimer);
  if ((q.type === 'radio' || q.type === 'scale') && t.value !== OTHER && !isLast(q)) {
    autoTimer = setTimeout(() => { if (stack[stack.length - 1] === q.id) $cta.click(); }, 320);
  }
});

$app.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.other) answers[t.dataset.other + '_other'] = t.value;
  if (t.dataset.text) { answers[t.dataset.text] = t.value; const c = $('cnt'); if (c) c.textContent = t.value.length; refreshCta(); }
});
$app.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.classList.contains('other')) { ev.preventDefault(); $cta.click(); }
});

/* ---------- 제출 ---------- */
function buildPayload(){
  const seen = new Set(stack);
  const now = new Date();
  const p = {
    response_id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2),
    started_at: startedAt ? startedAt.toISOString() : '',
    submitted_at: now.toISOString(),
    duration_sec: startedAt ? Math.round((now - startedAt) / 1000) : '',
    path: stack.filter(s => s !== 'intro' && s !== 'done').join('>'),
    device: matchMedia('(max-width: 600px)').matches ? 'mobile' : 'desktop',
    Q00_동의: '동의',
  };
  // 분기로 보지 않은 문항은 NA, 보고 건너뛴 문항은 빈칸
  for (const q of QS) {
    const s = seen.has(q.id);
    if (q.type === 'grid') {
      for (const [key] of q.rows) p[`${q.col}${key}`] = s ? ((answers[q.id] || {})[key] || '') : 'NA';
      continue;
    }
    const v = answers[q.id];
    p[q.col] = s ? (Array.isArray(v) ? v.join(' | ') : (v || '')) : 'NA';
    if (q.options && q.options.map(label).includes(OTHER)) {
      const picked = Array.isArray(v) ? v.includes(OTHER) : v === OTHER;
      p[`${q.col}_기타내용`] = s ? (picked ? (answers[q.id + '_other'] || '').trim() : '') : 'NA';
    }
  }
  return p;
}

async function submit(){
  busy = true;
  setCta('보내는 중…', true);
  $err.hidden = true;
  const payload = buildPayload();
  window.__lastPayload = payload;
  try {
    if (TEST_MODE) {
      console.log('[테스트 모드] 보낼 데이터', payload);
      await new Promise(r => setTimeout(r, 400));
    } else {
      await fetch(CONFIG.SCRIPT_URL, {
        method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(payload),
      });
    }
    try { localStorage.setItem(STORE_KEY, '1'); } catch(_){}
    busy = false;
    go('done');
  } catch (e) {
    busy = false;
    $err.textContent = '응답을 보내지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요. 입력한 내용은 그대로 있어요.';
    $err.hidden = false;
    setCta('다시 보내기', false);
  }
}

/* ---------- 시작 ---------- */
let already = false;
try { already = localStorage.getItem(STORE_KEY) === '1'; } catch(_){}
try { history.replaceState({d: 1}, ''); } catch(_){}
if (already && !TEST_MODE) { stack = ['already']; }
render('fwd');
</script>
</body>
</html>
